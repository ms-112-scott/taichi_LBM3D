# 階段式執行控制
run_mesh: true                      # 是否執行網格生成階段
run_simulation: true                # 是否執行模擬階段

# 幾何相關參數
geometry:
  stl_file: path_to_your_stl_file.stl  # 輸入的 STL 檔案路徑
  output_file: geometry.txt           # 輸出的體素化幾何檔案路徑
  voxel_size: 0.5                     # 體素大小 (解析度)

# 模擬相關參數
simulation:
  input_file: geometry.txt            # 輸入的體素化幾何檔案路徑
  nx: 100                             # 網格 X 方向大小 (會由 voxelize_geometry.py 自動更新)
  ny: 80                              # 網格 Y 方向大小 (會由 voxelize_geometry.py 自動更新)
  nz: 50                              # 網格 Z 方向大小 (會由 voxelize_geometry.py 自動更新)
  niu: 0.01                           # 流體黏滯係數
  fx: 1.0e-5                          # X 方向的外部力
  fy: 0.0                             # Y 方向的外部力
  fz: 0.0                             # Z 方向的外部力

  # 邊界條件設定
  # type: 0 = 週期性邊界 (periodic), 1 = 固定壓力邊界 (fix pressure), 2 = 固定速度邊界 (fix velocity)
  bc_x_left:
    type: 2
    rho: 1.0                          # 邊界壓力值 (僅在 type=1 時有效)
    vx: 1.0e-2                        # 邊界 X 方向速度 (僅在 type=2 時有效)
    vy: 0.0                           # 邊界 Y 方向速度 (僅在 type=2 時有效)
    vz: 0.0                           # 邊界 Z 方向速度 (僅在 type=2 時有效)
  bc_x_right:
    type: 1
    rho: 1.0
    vx: 0.0
    vy: 0.0
    vz: 0.0
  bc_y_left:
    type: 0
    rho: 1.0
    vx: 0.0
    vy: 0.0
    vz: 0.0
  bc_y_right:
    type: 0
    rho: 1.0
    vx: 0.0
    vy: 0.0
    vz: 0.0
  bc_z_left:
    type: 0
    rho: 1.0
    vx: 0.0
    vy: 0.0
    vz: 0.0
  bc_z_right:
    type: 0
    rho: 1.0
    vx: 0.0
    vy: 0.0
    vz: 0.0

  # 模擬與輸出設定
  max_timestep: 50000                 # 最大模擬時間步長
  output_frequency: 1000              # 終端輸出的頻率
  vtk_frequency: 10000                # VTK 檔案輸出的頻率
